# Daily data update in the cloud: fund NAVs, benchmarks, peer statistics and fund details → Supabase.
# Runs on GitHub's servers every day at 07:00 India time — no PC has to be on. Can also be started by hand
# (Actions tab → "Daily data update" → Run workflow). A failed run e-mails the repository owner.
# Keys come from the repository's Actions secrets (Settings → Secrets and variables → Actions); none is in code.
name: Daily data update

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC = 07:00 IST, every day
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:                 # never two updates writing to Supabase at the same time
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PULSE_PARTNER: ${{ secrets.PULSE_PARTNER }}
      PULSE_KEY: ${{ secrets.PULSE_KEY }}
      PYTHONIOENCODING: utf-8
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt
      - name: Install
        run: pip install -r data-pipeline/requirements.txt
      - name: Check the keys are set
        run: |
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY PULSE_PARTNER PULSE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; exit 1; fi
          done
      - name: Run the daily update
        run: python -u data-pipeline/run_daily.py
