<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PDF Viewer</title>
  <style>body { margin: 0; background: #525659; } canvas { display: block; margin: 16px auto; box-shadow: 0 2px 10px rgba(0,0,0,.5); background: #fff; } p { color: #fff; font-family: sans-serif; text-align: center; }</style>
</head>
<body>
  <p id="info">Loading…</p>
  <script type="module">
    // Debug aid: renders every page of a PDF to canvas — /tests/pdfview.html?src=out/report.pdf
    import * as pdfjs from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";
    const params = new URLSearchParams(location.search);
    const src = params.get("src");
    const scale = Number(params.get("scale") ?? 1.25);
    const pdf = await pdfjs.getDocument(src).promise;
    document.getElementById("info").textContent = `${pdf.numPages} page(s)`;
    const only = Number(params.get("page") ?? 0);
    for (let n = only || 1; n <= (only || pdf.numPages); n++) {
      const page = await pdf.getPage(n);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      document.body.append(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }
  </script>
</body>
</html>
